:root{--mint:#93f2c8;--green:#23bd88;--paper:#effaf5;--muted:#b5cec5;--glass:rgba(4,24,18,.82)}*{box-sizing:border-box}body{margin:0;background:#061710;color:var(--paper);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.app{min-height:100svh;max-width:520px;margin:auto;position:relative;overflow:hidden;display:flex;flex-direction:column;background:radial-gradient(ellipse at 50% 34%,#254e3f,#071b15 75%)}header{z-index:2;display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 15px) 20px 8px}.brand{font:25px Georgia,serif;letter-spacing:.02em}.brand small{display:block;color:#a3d7be;font:600 10px system-ui;letter-spacing:.16em}.online{font-size:11px;border:1px solid #ffffff40;border-radius:20px;padding:8px 11px;background:#0004}.online i{display:inline-block;width:7px;height:7px;border-radius:50%;background:#7dffc1;box-shadow:0 0 9px #7dffc1;margin-right:6px}.portrait{position:absolute;top:8%;left:0;right:0;height:56%;z-index:0;display:grid;place-items:center;overflow:hidden;background:#071b15}.portrait:before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse at 50% 42%,#a7f2ce45,transparent 58%);opacity:0}.portrait:after{content:"";position:absolute;inset:45% 0 0;background:linear-gradient(transparent,#071b15)}.portrait .face-art{position:relative;z-index:2;height:100%;width:100%;flex:none;animation:idle 5s ease-in-out infinite;transform-origin:50% 70%;will-change:transform}.portrait .face-art img{display:block;height:100%;width:100%;object-fit:cover;object-position:center 17%;filter:saturate(.94)}.app.speaking .portrait .face-art{animation:talk .72s ease-in-out infinite alternate}.app.speaking .portrait:before{animation:voiceGlow 1.25s ease-in-out infinite alternate}.app.happy .portrait img{filter:saturate(1.2) brightness(1.06)}.app.thinking .portrait img{filter:saturate(.78) brightness(.94)}@keyframes idle{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-8px) scale(1.018)}}@keyframes talk{0%{transform:translateY(0) scale(1.005);filter:brightness(1)}100%{transform:translateY(-4px) scale(1.035);filter:brightness(1.12)}}@keyframes voiceGlow{from{opacity:.05}to{opacity:.48}}@media(prefers-reduced-motion:reduce){.portrait .face-art,.app.speaking .portrait .face-art,.app.speaking .portrait:before{animation:none!important}}.content{margin-top:auto;position:relative;z-index:1;padding:0 15px calc(env(safe-area-inset-bottom) + 16px)}.switch{display:grid;grid-template-columns:1fr 1fr;padding:4px;background:#05160fcc;border:1px solid #c8ffdf2b;border-radius:16px;margin-bottom:11px}.switch button{padding:11px 8px;border:0;background:none;border-radius:12px;color:#c3d9d0;font-weight:800;font-size:13px}.switch .on{background:linear-gradient(135deg,#b4f4d5,#58d9a4);color:#082319;box-shadow:0 3px 15px #2bba8155}.chips{display:flex;gap:7px;overflow-x:auto;padding:0 0 10px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}.chip{white-space:nowrap;border:1px solid #c8ffdf35;color:#d5e9e0;background:#071b15c9;border-radius:30px;padding:8px 11px;font-size:11px}.chip.on{background:#d4f9e7;color:#09251a;font-weight:800}.panel{border:1px solid #d5ffe12b;border-radius:23px;background:var(--glass);backdrop-filter:blur(17px);padding:15px;box-shadow:0 14px 44px #0005}.tag{color:var(--mint);font-size:11px;font-weight:850;letter-spacing:.08em;display:flex;gap:8px;align-items:center}.tag:before{content:"";width:7px;height:7px;background:var(--mint);border-radius:50%;box-shadow:0 0 9px var(--mint)}.question{font:22px/1.32 Georgia,serif;margin:9px 0 5px}.jp{font-size:12px;color:var(--muted)}.answer{width:100%;min-height:52px;resize:vertical;border:1px solid #baffda22;border-radius:14px;background:#b9f4d50c;color:white;font:15px/1.5 inherit;padding:12px;margin:13px 0 9px}.answer::placeholder{color:#afc7bd}.buttons{display:grid;grid-template-columns:1fr auto;gap:8px}.speak,.check{border:0;border-radius:15px;padding:14px 13px;font-size:14px;font-weight:900}.speak{background:linear-gradient(135deg,#a7f2ce,#48c990);color:#082219}.speak.active{background:linear-gradient(135deg,#ffcbcb,#ed7777);animation:pulse .8s infinite}.check{background:#16372b;border:1px solid #baffda30;color:#e6fff2}.under{display:flex;justify-content:space-between;align-items:center;padding:11px 2px 0;color:#b6d2c6;font-size:11px}.under button{background:none;border:0;color:#a4f1c8;font-size:11px;text-decoration:underline}.feedback{display:none;padding:12px;margin-top:10px;border-radius:12px;background:#7ce5ae13;border-left:3px solid var(--mint);font-size:13px;line-height:1.6}.feedback.show{display:block}.feedback strong{color:#b2f5d2}.chatlog{display:grid;gap:8px;max-height:190px;overflow:auto;margin-top:10px}.bubble{padding:9px 11px;border-radius:13px;font-size:12px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}.bubble.user{justify-self:end;max-width:90%;background:#16513c}.bubble.partner{justify-self:start;max-width:90%;background:#102c22;border:1px solid #baffda24}.api-settings{margin:10px 2px 0;color:#bfd8cb;font-size:11px}.api-settings summary{cursor:pointer;color:#a4f1c8;text-decoration:underline}.api-settings p{line-height:1.5}.api-settings input{width:100%;border:1px solid #baffda30;border-radius:10px;background:#b9f4d50c;color:white;padding:10px;font-size:12px}.api-settings button{margin-top:7px;border:1px solid #baffda30;border-radius:10px;background:#16372b;color:#e6fff2;padding:8px 12px;font-weight:700}.api-status{display:block;margin-top:6px}.caption{height:4px;width:74px;border-radius:9px;background:#ffffff75;margin:12px auto 0}.count{color:#afc8bd;font-size:10px;text-align:right;margin-top:7px}@keyframes pulse{50%{transform:scale(.985);filter:brightness(1.15)}}@media(min-width:700px){body{padding:12px}.app{min-height:calc(100svh - 24px);border:1px solid #c8ffdf20;border-radius:28px}.portrait{top:6%;height:58%}}

.portrait .face-art .talk-frame{position:absolute;inset:0;z-index:3;width:100%;height:100%;object-fit:cover;object-position:center 17%;opacity:0;pointer-events:none}
.app.speaking .portrait .face-art .talk-frame{animation:lip-flap .28s steps(1,end) infinite}
@keyframes lip-flap{0%,49%{opacity:0}50%,100%{opacity:1}}
@media(prefers-reduced-motion:reduce){.portrait .face-art,.app.speaking .portrait .face-art,.app.speaking .portrait:before{animation:none!important}}

/* V4: hard split the viewport; portrait stays in top half, practice scrolls in bottom half */
html,body{width:100%;height:100%;overflow:hidden!important}
.app{position:relative!important;display:block!important;width:100%!important;height:100vh!important;height:100svh!important;min-height:0!important;overflow:hidden!important}
header{position:absolute!important;top:0!important;left:0!important;right:0!important;z-index:5!important;padding:calc(env(safe-area-inset-top) + 12px) 20px 8px!important;background:linear-gradient(180deg,rgba(4,25,18,.55),rgba(4,25,18,.08))!important}
.portrait{position:absolute!important;top:0!important;left:0!important;right:0!important;bottom:auto!important;width:100%!important;height:50vh!important;height:50svh!important;min-height:0!important;z-index:0!important;overflow:hidden!important}
.portrait .face-art{position:absolute!important;inset:0!important;width:100%!important;height:100%!important}
.portrait .face-art img{width:100%!important;height:100%!important;object-fit:cover!important;object-position:center 17%!important}
.content{position:absolute!important;top:50vh!important;top:50svh!important;right:0!important;bottom:0!important;left:0!important;width:100%!important;height:auto!important;min-height:0!important;margin:0!important;padding:10px 15px calc(env(safe-area-inset-bottom) + 16px)!important;overflow-x:hidden!important;overflow-y:auto!important;-webkit-overflow-scrolling:touch!important;overscroll-behavior:contain!important;z-index:3!important;background:linear-gradient(180deg,#0a261d,#061710 92%)!important}
.app.speaking .portrait .face-art .talk-frame{animation:lip-flap .30s steps(1,end) infinite!important}
@keyframes lip-flap{0%,49%{opacity:0}50%,100%{opacity:1}}
@media(min-width:700px){body{padding:0}.app{max-width:520px!important;margin:0 auto!important}.portrait{height:50svh!important}.content{top:50svh!important}}

/* V5: keep the portrait still; animate only a softened mouth overlay. */
.portrait .face-art,
.app.speaking .portrait .face-art{
  animation:none!important;
  transform:none!important;
  filter:none!important;
}
.portrait .face-art .talk-frame{
  opacity:0;
  transition:opacity .18s ease-in-out;
  will-change:opacity;
}
.app.speaking .portrait .face-art .talk-frame{
  animation:lip-sync-soft .82s ease-in-out infinite!important;
}
@keyframes lip-sync-soft{
  0%,100%{opacity:.08}
  22%{opacity:.66}
  42%{opacity:.22}
  66%{opacity:.74}
  84%{opacity:.16}
}
.portrait:before{
  animation:portrait-glow 6s ease-in-out infinite!important;
}
@keyframes portrait-glow{
  0%,100%{opacity:.10}
  50%{opacity:.27}
}
.online i{
  animation:status-pulse 2.2s ease-in-out infinite;
}
@keyframes status-pulse{
  0%,100%{opacity:.72;box-shadow:0 0 5px #7dffc1}
  50%{opacity:1;box-shadow:0 0 13px #7dffc1}
}
@media(prefers-reduced-motion:reduce){
  .portrait .face-art,.app.speaking .portrait .face-art,.portrait:before,.online i,
  .app.speaking .portrait .face-art .talk-frame{animation:none!important}
  .app.speaking .portrait .face-art .talk-frame{opacity:.55}
}

/* V6: show an embedded talking GIF only while speech audio is playing. */
.portrait .face-art .talk-frame{opacity:0!important;animation:none!important;transition:none!important}
.app.speaking .portrait .face-art .talk-frame{opacity:1!important;animation:none!important}
</style></head>

<section class="content">
<nav class="switch"><button class="on" data-mode="shop">中古品店</button><button data-mode="daily">雑談・日常会話</button></nav>
<nav id="chips" class="chips"></nav>
<section class="panel"><div class="tag" id="scenario">取り置きのお願い</div><div class="question" id="question"></div><div class="jp" id="translation"></div>
<textarea id="answer" class="answer" placeholder="ここに英語を入力、またはマイクで話してみよう"></textarea>
<div class="buttons"><button id="mic" class="speak">🎙 英語で話す</button><button id="check" class="check">マルフォイドに返事</button></div>
<div class="under"><span id="hint">短くて大丈夫。自分の言葉で返してみよう。</span><button id="model">例文を聞く</button></div><div id="feedback" class="feedback"></div><div class="count" id="counter"></div><div id="chatLog" class="chatlog" aria-live="polite"></div></section>
<details class="api-settings"><summary>AI会話の接続設定</summary><p>サーバーのURLを一度設定すると、AIが返事をして会話が続くよ。</p><input id="apiUrl" type="url" inputmode="url" placeholder="https://your-worker.workers.dev"><button id="saveApi">URLを保存・接続確認</button><span id="apiStatus" class="api-status"></span></details>
<div class="caption"></div></section></main>
<script>
const data={shop:[
 {tag:'取り置き',q:'Can you hold this item until tomorrow?',jp:'この商品を明日まで取り置きできますか？',a:'Sorry, we can only hold it until the end of today.',tip:'can only hold it until ... で「〜まで取り置きできます」。'},
 {tag:'配送',q:'Can you deliver this sofa to Hakusan City?',jp:'このソファを白山市まで配送できますか？',a:'Yes, we can deliver to Hakusan City. The delivery fee depends on the area.',tip:'deliver to + 場所。料金は depends on the area と説明できます。'},
 {tag:'値引き',q:'Could you give me a discount?',jp:'値引きしてもらえますか？',a:'I’m sorry, but this is our lowest price, so we can’t lower it.',tip:'「最安値」は best price より our lowest price が自然。'},
 {tag:'商品の状態',q:'Are there any problems with it?',jp:'何か問題はありますか？',a:'There are no major issues, but there are a few scratches on the surface.',tip:'商品の傷は scratches。injury は人のけがに使います。'},
 {tag:'付属品',q:'Does it come with the original charger?',jp:'純正充電器は付属していますか？',a:'Yes, it comes with the original charger.',tip:'It comes with ... は「〜が付属しています」。'},
 {tag:'返品',q:'Can I return it if it doesn’t work?',jp:'動かなかった場合、返品できますか？',a:'You can return it within seven days of purchase if you have the receipt.',tip:'within seven days of purchase で「購入から7日以内」。'},
 {tag:'会計',q:'Can I pay by credit card?',jp:'クレジットカードで払えますか？',a:'Yes, you can pay by credit card.',tip:'支払い方法は pay by + 方法。'}],daily:[
 {tag:'休日',q:'What do you usually do on your days off?',jp:'休みの日は普段何をしていますか？',a:'I usually go for a run or relax at home.',tip:'usually のあとに普段の習慣を続けます。'},
 {tag:'旅行',q:'What was your favorite place you visited?',jp:'今まで行った場所で一番好きなところは？',a:'My favorite place was Kyoto. I loved the old streets and temples.',tip:'favorite place を先に答えて、理由を一つ足すと会話が続きます。'},
 {tag:'趣味',q:'What do you like to do in your free time?',jp:'暇なときは何をするのが好きですか？',a:'I like watching videos and going for a run.',tip:'I like + 動詞ing で好きなことを言えます。'},
 {tag:'天気',q:'It’s getting chilly, isn’t it?',jp:'だんだん肌寒くなってきましたね。',a:'Yeah, it is. I’m looking forward to the fall weather.',tip:'相づちに一言足すだけで自然に会話が続きます。'},
 {tag:'地元',q:'What’s your hometown like?',jp:'地元はどんなところですか？',a:'I’m from Kanazawa. It’s known for its history and traditional crafts.',tip:'地元の名前＋It’s known for ... で紹介できます。'},
 {tag:'週末',q:'Do you have any plans for this weekend?',jp:'今週末は何か予定ありますか？',a:'I’m planning to go for a run and get some rest.',tip:'I’m planning to ... で予定を伝えられます。'}]};
let mode='shop',idx=0,recog,conversation=[],speechToken=0;const $=id=>document.getElementById(id),app=$('app');
const endpoint=()=>($('apiUrl').value||'').trim().replace(/\/chat\/?$/,'').replace(/\/$/,'');
function item(){return data[mode][idx%data[mode].length]}
function speech(text){if(!('speechSynthesis'in window)||!text)return;const token=++speechToken;speechSynthesis.cancel();app.classList.remove('speaking');const frame=document.querySelector('.talk-frame');const gifSrc=frame?frame.src:'';let u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=.9;const stop=()=>{if(token===speechToken)app.classList.remove('speaking')};u.onstart=()=>{if(token!==speechToken)return;app.classList.add('speaking');if(frame&&gifSrc){frame.src='';requestAnimationFrame(()=>{if(token===speechToken)frame.src=gifSrc})}};u.onend=stop;u.onerror=stop;speechSynthesis.speak(u)}
function showNote(title,text){const box=$('feedback');box.replaceChildren();const strong=document.createElement('strong');strong.textContent=title;const body=document.createElement('div');body.textContent=text;box.append(strong,body);box.className='feedback show'}
function addBubble(kind,label,text){const b=document.createElement('div');b.className='bubble '+kind;b.textContent=label+'：'+text;$('chatLog').appendChild(b);$('chatLog').scrollTop=$('chatLog').scrollHeight}
function addFeedback(data){const box=$('feedback');box.replaceChildren();for(const [label,value] of [['自然な英語',data.correction],['ひとこと修正',data.feedback_ja]]){const row=document.createElement('p');row.style.margin='0 0 7px';const strong=document.createElement('strong');strong.textContent=label+'：';const span=document.createElement('span');span.textContent=value||'—';row.append(strong,span);box.appendChild(row)}box.className='feedback show'}
function draw(){const x=item();$('scenario').textContent=x.tag;$('question').textContent=x.q;$('translation').textContent=x.jp;$('answer').value='';$('feedback').className='feedback';$('feedback').replaceChildren();$('chatLog').replaceChildren();conversation=[];$('counter').textContent=(idx+1)+' / '+data[mode].length;document.querySelectorAll('.chip').forEach((b,i)=>b.classList.toggle('on',i===idx));}
function chips(){ $('chips').innerHTML=data[mode].map((x,i)=>`<button class="chip ${i===idx?'on':''}" data-i="${i}">${x.tag}</button>`).join(''); document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{idx=+b.dataset.i;draw()})}
function changeMode(m){mode=m;idx=0;document.querySelectorAll('.switch button').forEach(b=>b.classList.toggle('on',b.dataset.mode===mode));chips();draw()}
async function check(){const val=$('answer').value.trim();if(!val){showNote('まずは一言','英語で答えてみよう。短くて大丈夫。');return}const x=item(),base=endpoint();
 if(!base){addBubble('user','あなた',val);showNote('AIサーバー未接続','固定の例文を表示するね。AIと会話するには、下の「AI会話の接続設定」でサーバーURLを登録してね。例文：'+x.a+' ／ '+x.tip);speech(x.a);return}
 const button=$('check');button.disabled=true;button.textContent='返事を考え中…';showNote('マルフォイド','ちょっと考えるね…');
 try{const messages=[...conversation,{role:'user',content:val}].slice(-12);const res=await fetch(base+'/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode,category:x.tag,opening:x.q,messages})});const result=await res.json();if(!res.ok)throw new Error(result.error||'通信に失敗したよ');
 addBubble('user','あなた',val);addBubble('partner','マルフォイド',result.reply_en);conversation.push({role:'user',content:val},{role:'assistant',content:result.reply_en});conversation=conversation.slice(-12);addFeedback(result);$('answer').value='';app.classList.add('happy');app.classList.remove('thinking');speech((result.correction||'')+'. '+(result.reply_en||''));
 }catch(e){showNote('接続できなかった','URLとサーバー設定を確認してね。もう一度試せるよう、入力した英文は残してあるよ。');app.classList.add('thinking')}
 finally{button.disabled=false;button.textContent='マルフォイドに返事'}
}
async function saveApi(){const input=$('apiUrl'),status=$('apiStatus');let base=(input.value||'').trim().replace(/\/chat\/?$/,'').replace(/\/$/,'');if(!base){localStorage.removeItem('malfoidApiBase');status.textContent='URLを消したよ。';return}try{const u=new URL(base);if(!['https:','http:'].includes(u.protocol)||(!u.hostname.includes('localhost')&&u.protocol!=='https:'))throw new Error();input.value=base;const res=await fetch(base+'/health');if(!res.ok)throw new Error();localStorage.setItem('malfoidApiBase',base);status.textContent='接続できた！AI会話を始められるよ。'}catch{status.textContent='接続確認できなかったよ。WorkerのURLと公開設定を確認してね。'}}
document.querySelectorAll('.switch button').forEach(b=>b.onclick=()=>changeMode(b.dataset.mode));$('check').onclick=check;$('model').onclick=()=>speech(item().a);$('saveApi').onclick=saveApi;$('apiUrl').value=localStorage.getItem('malfoidApiBase')||'';
$('mic').onclick=()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){showNote('音声入力が使えないみたい','上の欄に英語を入力して練習してね。');return}recog=new SR();recog.lang='en-US';recog.interimResults=true;let b=$('mic');b.classList.add('active');b.textContent='● 聞いてるよ…';recog.onresult=e=>{$('answer').value=Array.from(e.results).map(r=>r[0].transcript).join('')};recog.onerror=()=>showNote('聞き取れなかったみたい','少しゆっくり言うか、入力してみて。');recog.onend=()=>{b.classList.remove('active');b.textContent='🎙 英語で話す'};recog.start()};
chips();draw();
</script></body></html>
